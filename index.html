<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f7fa">
<title>测一测你是哪部动漫里的谁</title>
<meta name="description" content="测一测你是哪部动漫里的谁，看看你的灵魂落在哪个故事里。">
<style>
/* ==========================================================
   测一测你是哪部动漫里的谁 — 视觉层
   ========================================================== */

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #aedcf7;
  --bg2: #c9e8fb;
  --pink: #3b8fd6;
  --lav: #4a95d6;
  --ink: #1c3a55;
  --ink2: #3d5d7d;
  --ink3: #55718f;
  --line: rgba(40, 90, 140, 0.14);
  --card: rgba(255, 255, 255, 0.55);
  --accent: #3b8fd6;
  --ac: #3b8fd6;
  --ac-light: #5aa7e6;
}

html { -webkit-text-size-adjust: 100%; }

body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
               "Microsoft YaHei", "Segoe UI", sans-serif;
  line-height: 1.7;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  background: #f4f7fa url("bg.jpg") center / cover no-repeat;
}

/* 柔化遮罩：让前景文字与卡片更清晰、统一 */
.bg::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0.14) 45%, rgba(255,255,255,0.32) 100%);
}

/* ---------- 布局 ---------- */
.wrap {
  position: relative;
  z-index: 1;
  max-width: 660px;
  margin: 0 auto;
  padding: 56px 22px 80px;
}

.screen { display: none; }

.screen.is-active {
  display: block;
  animation: fadeUp 0.55s cubic-bezier(.22, .9, .25, 1) forwards;
}

#s-start.is-active {
  min-height: calc(100vh - 136px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  width: 100%;
  min-width: 0;
}

#s-start .btn-primary { align-self: flex-start; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ---------- 封面 ---------- */
.kicker {
  font-size: 11px;
  letter-spacing: 0.34em;
  color: var(--pink);
  text-transform: uppercase;
  margin-bottom: 22px;
  font-weight: 600;
}

#s-start h1 {
  font-size: clamp(34px, 8.6vw, 52px);
  line-height: 1.16;
  font-weight: 800;
  letter-spacing: -0.02em;
  background: linear-gradient(120deg, #0f3050 10%, #1f5b92 55%, #2f7cbc 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 22px;
}

.sub {
  color: var(--ink2);
  font-size: 14.5px;
  line-height: 1.9;
  margin-bottom: 30px;
}

.emoji-strip {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 2px;
  margin-bottom: 36px;
  padding: 14px 8px;
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.55);
  overflow: hidden;
}

.emoji-strip span {
  flex: 0 0 40px;
  width: 40px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  line-height: 1;
  opacity: 0.75;
  filter: grayscale(0.1);
  transition: opacity 0.3s, transform 0.3s;
}

.emoji-strip:hover span { opacity: 1; }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  padding: 15px 40px;
  border-radius: 999px;
  transition: transform 0.25s cubic-bezier(.2, .9, .3, 1.2), box-shadow 0.3s, opacity 0.2s;
  letter-spacing: 0.02em;
}

.btn-primary {
  background: linear-gradient(115deg, #5aa8f0, #3f7fd6);
  color: #fff;
  box-shadow: 0 10px 32px -10px rgba(90, 168, 240, 0.7), inset 0 1px 0 rgba(255,255,255,.25);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 42px -12px rgba(90, 168, 240, 0.85), inset 0 1px 0 rgba(255,255,255,.3);
}

.btn-primary:active { transform: translateY(0) scale(0.985); }

.btn-ghost {
  background: rgba(255, 255, 255, 0.6);
  color: var(--ink);
  border: 1px solid var(--line);
}

.btn-ghost:hover { background: rgba(255, 255, 255, 0.85); transform: translateY(-2px); }

.hint {
  margin-top: 18px;
  font-size: 12.5px;
  color: var(--ink3);
}

/* ---------- 提取码 ---------- */
.gate {
  margin-bottom: 22px;
}

.gate-label {
  display: block;
  font-size: 13px;
  color: var(--ink2);
  margin-bottom: 9px;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.gate-input {
  display: block;
  width: 100%;
  max-width: 280px;
  padding: 12px 16px;
  font-size: 19px;
  letter-spacing: 0.5em;
  text-align: center;
  color: var(--ink);
  background: rgba(255, 255, 255, 0.88);
  border: 1.5px solid rgba(59, 143, 214, 0.25);
  border-radius: 12px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  font-variant-numeric: tabular-nums;
  -webkit-appearance: none;
  appearance: none;
  font-family: inherit;
}

.gate-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(59, 143, 214, 0.15);
}

.gate-input::placeholder {
  color: var(--ink3);
  letter-spacing: 0.06em;
  font-size: 13.5px;
}

.gate-err {
  display: none;
  margin-top: 9px;
  font-size: 12.5px;
  color: #d64545;
}

.gate-err.show { display: block; }

.gate-input.err {
  border-color: #d64545;
  animation: shake .32s;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25%      { transform: translateX(-5px); }
  75%      { transform: translateX(5px); }
}

/* ---------- 答题 ---------- */
.qbar {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 34px;
}

.qcount {
  font-size: 13px;
  color: var(--ink2);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.06em;
  white-space: nowrap;
}

.qcount span:first-child { color: var(--ink); font-weight: 700; font-size: 17px; }

.track {
  flex: 1;
  height: 4px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.55);
  overflow: hidden;
}

.fill {
  height: 100%;
  width: 0%;
  border-radius: 4px;
  background: linear-gradient(90deg, #6ab4f5, #3f7fd6);
  transition: width 0.5s cubic-bezier(.22, .9, .25, 1);
  box-shadow: 0 0 12px rgba(106, 180, 245, 0.6);
}

.linkbtn {
  background: none;
  border: none;
  color: var(--ink3);
  font-family: inherit;
  font-size: 12.5px;
  cursor: pointer;
  padding: 6px 2px;
  transition: color 0.2s;
  white-space: nowrap;
}

.linkbtn:hover { color: var(--pink); }

.qcard.anim { animation: cardIn 0.42s cubic-bezier(.22, .9, .25, 1) both; }

@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.qindex {
  font-size: 11px;
  letter-spacing: 0.28em;
  color: var(--lav);
  font-weight: 700;
  margin-bottom: 12px;
}

.qtext {
  font-size: clamp(21px, 4.6vw, 27px);
  line-height: 1.55;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin-bottom: 28px;
}

.opts { display: flex; flex-direction: column; gap: 11px; }

.opt {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  text-align: left;
  padding: 16px 18px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font-family: inherit;
  font-size: 15px;
  line-height: 1.6;
  cursor: pointer;
  transition: border-color 0.22s, background 0.22s, transform 0.22s, box-shadow 0.22s;
}

.opt:hover {
  border-color: rgba(108, 183, 255, 0.5);
  background: rgba(108, 183, 255, 0.07);
  transform: translateX(3px);
}

.opt-key {
  flex: 0 0 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  border: 1px solid var(--line);
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ink2);
  transition: all 0.22s;
}

.opt:hover .opt-key { color: var(--pink); border-color: rgba(108,183,255,.45); }

.opt.picked {
  border-color: rgba(108, 183, 255, 0.85);
  background: linear-gradient(90deg, rgba(108, 183, 255, 0.16), rgba(63, 127, 214, 0.09));
  box-shadow: 0 0 0 1px rgba(108, 183, 255, 0.25), 0 8px 26px -14px rgba(108, 183, 255, 0.8);
}

.opt.picked .opt-key {
  background: linear-gradient(135deg, #6ab4f5, #3f7fd6);
  border-color: transparent;
  color: #fff;
}

.opt-text { flex: 1; }

.back { margin-top: 22px; }

/* ---------- 结果页 ---------- */
.res-kicker {
  text-align: center;
  font-size: 11.5px;
  letter-spacing: 0.32em;
  color: #3d5d7d;
  margin-bottom: 26px;
}

.hero { text-align: center; }

.avatar {
  width: 132px;
  height: 132px;
  margin: 0 auto 22px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 46px;
  line-height: 1;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 32% 24%, rgba(255, 255, 255, 0.85), transparent 58%),
    linear-gradient(160deg, #dff0fc 0%, #c5e4fa 62%, #b0d8f5 100%);
  box-shadow:
    0 0 0 1px rgba(59, 143, 214, 0.3),
    0 0 0 7px rgba(255, 255, 255, 0.5),
    0 16px 42px -20px rgba(59, 143, 214, 0.55);
  animation: pop 0.7s cubic-bezier(.2, .9, .3, 1.25) both;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 16%;
  display: block;
}

.av-emoji {
  width: 100%;
  height: 100%;
  place-items: center;
}

@keyframes pop {
  from { opacity: 0; transform: scale(0.75); }
  to   { opacity: 1; transform: scale(1); }
}

.hero-name {
  font-size: clamp(28px, 6.4vw, 38px);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.3;
  background: linear-gradient(120deg, #12395c, #2b6ea8 95%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero-anime {
  color: var(--ink2);
  font-size: 14.5px;
  margin-top: 6px;
  letter-spacing: 0.04em;
}

.tags {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 18px;
}

.tags span {
  font-size: 12px;
  padding: 5px 13px;
  border-radius: 999px;
  border: 1px solid rgba(59, 143, 214, 0.35);
  background: rgba(255, 255, 255, 0.75);
  color: #1f5b92;
  letter-spacing: 0.04em;
}

/* 环形 */
.ring {
  position: relative;
  width: 168px;
  margin: 36px auto 40px;
  text-align: center;
}

.ring svg { width: 100%; transform: rotate(-90deg); display: block; }

.ring-bg { fill: none; stroke: rgba(59, 143, 214, 0.15); stroke-width: 6; }

.ring-fg {
  fill: none;
  stroke: var(--accent);
  stroke-width: 7;
  stroke-linecap: round;
  filter: drop-shadow(0 1px 2px rgba(59, 143, 214, 0.25));
}

.ring-num {
  position: absolute;
  top: 50%; left: 0; right: 0;
  transform: translateY(-58%);
  font-variant-numeric: tabular-nums;
}

.ring-num b {
  font-size: 40px;
  font-weight: 800;
  letter-spacing: -0.03em;
  background: linear-gradient(120deg, #12395c, #2b6ea8);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.ring-num i { font-style: normal; font-size: 15px; color: var(--ink2); margin-left: 2px; }

.ring-cap {
  font-size: 11.5px;
  letter-spacing: 0.2em;
  color: #4d6c8a;
  margin-top: 10px;
}

/* 面板 */
.panel {
  border: 1px solid var(--line);
  border-radius: 20px;
  background: linear-gradient(160deg, rgba(255,255,255,0.72), rgba(255,255,255,0.45));
  padding: 26px 24px;
  margin-bottom: 18px;
  box-shadow: 0 8px 28px -18px rgba(40, 90, 140, 0.5);
  backdrop-filter: blur(8px);
}

.panel-t {
  font-size: 11.5px;
  letter-spacing: 0.24em;
  color: var(--ink3);
  font-weight: 600;
  margin-bottom: 14px;
}

.desc {
  font-size: 15.5px;
  line-height: 1.95;
  color: #2c4a66;
}

.quote {
  margin-top: 18px;
  padding: 14px 0 4px 18px;
  border-left: 2px solid rgba(59, 143, 214, 0.55);
  font-size: 15px;
  color: #2b6ea8;
  font-style: italic;
  letter-spacing: 0.02em;
}

/* 能力结构图 */
.abil { margin-top: 2px; }

.abil-row {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-bottom: 11px;
}
.abil-row:last-child { margin-bottom: 0; }

.abil-k {
  flex: 0 0 52px;
  font-size: 13px;
  color: var(--ink2);
  letter-spacing: 0.02em;
}

.abil-bar {
  flex: 1;
  height: 8px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.6);
  box-shadow: inset 0 0 0 1px var(--line);
  overflow: hidden;
}

.abil-bar i {
  display: block;
  height: 100%;
  width: 0;
  border-radius: 8px;
  background: linear-gradient(90deg, var(--ac-light, #5aa7e6), var(--accent, #3b8fd6));
  transition: width 1.1s cubic-bezier(.22, .9, .25, 1);
}

.abil-v {
  flex: 0 0 28px;
  text-align: right;
  font-size: 12.5px;
  color: var(--ink3);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}

.abil-sum {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px dashed var(--line);
  font-size: 14px;
  line-height: 1.85;
  color: #2b6ea8;
}

/* 风险提醒面板 */
.panel-risk {
  background: linear-gradient(160deg, rgba(255, 246, 240, 0.85), rgba(255, 240, 236, 0.55));
  border-color: rgba(214, 120, 80, 0.28);
}
.panel-risk .panel-t { color: #b0674a; }
.panel-risk .desc { color: #6b4232; }

/* 雷达 */
.radar-wrap { margin-top: 6px; }
.radar { width: 100%; max-width: 340px; display: block; margin: 0 auto; }

.legend {
  display: flex;
  justify-content: center;
  gap: 22px;
  margin-top: 4px;
  font-size: 12px;
  color: var(--ink2);
}

.legend span { display: inline-flex; align-items: center; gap: 6px; }

.dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

.dot.you { background: var(--pink); }
.dot.him { background: var(--accent); }

/* 其他匹配 */
.minis { display: flex; flex-direction: column; gap: 10px; }

.mini {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 12px 14px;
  border-radius: 13px;
  background: rgba(255, 255, 255, 0.6);
  border: 1px solid var(--line);
}

.mini-av {
  width: 38px; height: 38px;
  flex: 0 0 38px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  font-size: 18px;
  border: 1px solid rgba(59, 143, 214, 0.2);
  background: rgba(255, 255, 255, 0.7);
}

.mini-info { display: flex; flex-direction: column; line-height: 1.45; min-width: 0; }

.mini-info b { font-size: 14px; font-weight: 600; }

.mini-info span { font-size: 12px; color: var(--ink3); }

.actions {
  display: flex;
  gap: 12px;
  margin-top: 30px;
  flex-wrap: wrap;
}

.actions .btn { flex: 1; min-width: 140px; padding: 15px 24px; }

.foot {
  margin-top: 34px;
  text-align: center;
  font-size: 11.5px;
  color: var(--ink3);
  line-height: 1.8;
}

/* ---------- 移动端 ---------- */
@media (max-width: 480px) {
  .wrap { padding: 40px 18px 64px; }
  .panel { padding: 22px 18px; border-radius: 17px; }
  .opt { padding: 15px 15px; font-size: 14.5px; }
  .emoji-strip { padding: 12px 6px; }
  .emoji-strip span { flex: 0 0 34px; width: 34px; height: 34px; font-size: 16px; }
  .actions .btn { flex: 1 1 100%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

</style>
</head>
<body>

<div class="bg" aria-hidden="true"></div>

<main class="wrap">

  <!-- 封面 -->
  <section class="screen is-active" id="s-start">
    <p class="kicker">Anime Soul Match</p>
    <h1>测一测<br>你是哪部动漫里的谁</h1>
    <p class="sub">看看你的灵魂，落在哪个故事里</p>

    <div class="gate">
      <label class="gate-label" for="gateCode">请输入提取码</label>
      <input class="gate-input" id="gateCode" type="text" inputmode="numeric" maxlength="4"
             placeholder="4 位数字" autocomplete="off">
      <p class="gate-err" id="gateErr">提取码错误，再试一次</p>
    </div>

    <button class="btn btn-primary" id="btnStart">开始测试</button>
    <p class="hint">凭第一直觉作答，别想太久</p>
  </section>

  <!-- 答题 -->
  <section class="screen" id="s-quiz">
    <div class="qbar">
      <div class="qcount"><span id="qNow">1</span> / <span id="qTotal">25</span></div>
      <div class="track"><div class="fill" id="qFill"></div></div>
      <button class="linkbtn" id="btnQuit">重来</button>
    </div>

    <div class="qcard" id="qCard">
      <p class="qindex" id="qIndex">Q1</p>
      <h2 class="qtext" id="qText"></h2>
      <div class="opts" id="qOpts"></div>
    </div>

    <button class="linkbtn back" id="btnBack">← 上一题</button>
  </section>

  <!-- 结果 -->
  <section class="screen" id="s-result">
    <div id="resultBody"></div>
  </section>

</main>

<script>
/* ==========================================================
   测一测你是哪部动漫里的谁
   40 角色 / 25 题 / 8 维性格向量 / 中心化余弦相似度
   ========================================================== */

const DIMS = ['warm', 'calm', 'strong', 'loyal', 'dark', 'lively', 'distant', 'obsess'];

const DIM_LABEL = {
  warm: '温柔', calm: '理智', strong: '强势', loyal: '专一',
  dark: '腹黑', lively: '外放', distant: '疏离', obsess: '执着'
};

/* ---------------- 角色库：40 个不同作品 ---------------- */
const CHARS = [
  {
    n: '塞巴斯蒂安·米卡利斯', a: '黑执事', e: '🕯️', c: '#6f9fd6', img: 'https://s4.anilist.co/file/anilistcdn/character/large/b10863-DsfonbP2CATa.png',
    t: ['完美主义', '腹黑', '优雅'],
    d: '你身上有一种“提前三步”的从容。别人还在慌乱找线索，你已经把茶杯摆好、把退路封死。你不喜欢情绪化的场面，因为情绪会让判断失准。你对“完美”的要求近乎苛刻——不是为了让谁满意，而是受不了自己做出一件粗糙的事。你也会照顾人，但那份照顾像精准的服务，带着恰到好处的距离。',
    q: '完美不是要求，是习惯。',
    m: '你习惯用从容掩盖锋利——真正的掌控，从来不需要大声。',
    v: [5,9,7,8,10,3,7,5],

/* ---------------- 匹配算法 ----------------
   题目里各维度的权重天然不均（温柔出现得多、外放出现得少），
   直接用原始分做余弦会让结果偏向某几类角色。这里用两次标准化消除偏差：
   1) 用户分 → 相对随机期望的 z 分数（各维度同尺度）
   2) 角色分 → 跨 40 角色的 z 分数（各维度同等话语权）
   -------------------------------------------------- */
const USER_MU = [20.99, 22.26, 15.49, 14.76, 15.27, 16.98, 20.48, 14.26];
const USER_SD = [5.46, 6.26, 5.69, 5.11, 5.28, 5.90, 6.55, 4.95];
const CHAR_MU = [6.22, 7.08, 7.10, 7.22, 5.38, 5.25, 5.60, 6.78];
const CHAR_SD = [2.36, 1.69, 2.36, 2.16, 2.76, 2.78, 2.52, 2.20];

function scoreVector(answers) {
  const s = {};
  DIMS.forEach(d => { s[d] = 0; });
  answers.forEach((pick, qi) => {
    if (pick == null) return;
    const opt = QUESTIONS[qi].o[pick];
    for (const k in opt.v) s[k] += opt.v[k];
  });
  return DIMS.map(d => s[d]);
}

function center(v) {
  const m = v.reduce((a, b) => a + b, 0) / v.length;
  return v.map(x => x - m);
}

// 用户分 → 相对随机期望的 z 分数，再中心化
function zUser(u) {
  return center(u.map((x, i) => (x - USER_MU[i]) / USER_SD[i]));
}

// 角色分 → 跨角色的 z 分数，再中心化
function zChar(c) {
  return center(c.v.map((x, i) => (x - CHAR_MU[i]) / CHAR_SD[i]));
}

function cosine(a, b) {
  let dot = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++) {
    dot += a[i] * b[i];
    na += a[i] * a[i];
    nb += b[i] * b[i];
  }
  if (!na || !nb) return 0;
  return dot / Math.sqrt(na * nb);
}

function matchAll(answers) {
  const u = scoreVector(answers);
  const uz = zUser(u);
  const list = CHARS.map(c => ({ c, raw: cosine(uz, zChar(c)) }));
  list.sort((x, y) => y.raw - x.raw);

  // 余弦 → 展示用的相似度：主结果落在 85~95%，第二三名自然低一档
  let prev = 100;
  list.forEach(item => {
    const r = Math.max(0, Math.min(1, item.raw));
    let pct = Math.round(100 * (0.55 + 0.45 * Math.pow(r, 0.85)));
    pct = Math.min(99, Math.max(58, pct));
    if (pct >= prev) pct = prev - 1;   // 保证名次之间不撞分
    prev = pct;
    item.pct = pct;
  });
  return { user: u, list };
}

// #RRGGBB + 透明度 → rgba()，兼容老内核
function hexA(hex, a) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(x => x + x).join('');
  const r = parseInt(h.slice(0, 2), 16);
  const g = parseInt(h.slice(2, 4), 16);
  const b = parseInt(h.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${a})`;
}

// 与白色混合，得到同色系的亮色（用于文字，保证深色背景上的对比度）
function lighten(hex, t) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(x => x + x).join('');
  const mix = v => Math.round(v + (255 - v) * t);
  return `rgb(${mix(parseInt(h.slice(0, 2), 16))},${mix(parseInt(h.slice(2, 4), 16))},${mix(parseInt(h.slice(4, 6), 16))})`;
}

function applyAccent(hex) {
  const s = document.documentElement.style;
  s.setProperty('--accent', hex);
  s.setProperty('--ac', hex);
  s.setProperty('--ac-light', lighten(hex, 0.52));
  const levels = { '--ac18': 0.18, '--ac35': 0.35, '--ac45': 0.45, '--ac55': 0.55,
                   '--ac60': 0.60, '--ac65': 0.65, '--ac80': 0.80, '--ac85': 0.85 };
  for (const k in levels) s.setProperty(k, hexA(hex, levels[k]));
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('is-active'));
  document.getElementById(id).classList.add('is-active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderQuestion() {
  const q = QUESTIONS[state.idx];
  $('#qNow').textContent = state.idx + 1;
  $('#qTotal').textContent = QUESTIONS.length;
  $('#qFill').style.width = ((state.idx) / QUESTIONS.length * 100) + '%';
  $('#qIndex').textContent = 'Q' + (state.idx + 1);

  const card = $('#qCard');
  card.classList.remove('anim');
  void card.offsetWidth;
  card.classList.add('anim');

  $('#qText').textContent = q.q;

  const opts = $('#qOpts');
  opts.innerHTML = '';
  q.o.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt-key">${'ABCDEF'[i]}</span><span class="opt-text">${opt.t}</span>`;
    if (state.answers[state.idx] === i) btn.classList.add('picked');
    btn.addEventListener('click', () => pick(i, btn));
    opts.appendChild(btn);
  });

  $('#btnBack').style.visibility = state.idx === 0 ? 'hidden' : 'visible';
}

let locked = false;
function pick(i, btn) {
  if (locked) return;
  locked = true;
  state.answers[state.idx] = i;
  document.querySelectorAll('.opt').forEach(o => o.classList.remove('picked'));
  btn.classList.add('picked');

  setTimeout(() => {
    locked = false;
    if (state.idx < QUESTIONS.length - 1) {
      state.idx++;
      renderQuestion();
    } else {
      $('#qFill').style.width = '100%';
      goResult();
    }
  }, 320);
}

  });

  // 雷达图：与匹配算法同源，都用 z 分数，两条线形状才可比
  drawRadar(zUser(user), zChar(c), c.c);

  document.getElementById('btnAgain').onclick = () => {
    state.idx = 0;
    state.answers = new Array(QUESTIONS.length).fill(null);
    showScreen('s-start');
  };

  document.getElementById('btnCopy').onclick = () => {
    const txt = `我的动漫人格是《${c.a}》的${c.n}（${pct}% 匹配）
标签：${c.t.join(' / ')}

【性格画像】${c.d}

【你与 TA 的共同底色】${c.base}

【性格盲点与风险】${c.risk}

「${c.q}」`;
    const done = () => {
      const b = document.getElementById('btnCopy');
      b.textContent = '已复制 ✓';
      setTimeout(() => { b.textContent = '复制结果'; }, 1600);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(txt).then(done).catch(fallback);
    } else { fallback(); }
    function fallback() {
      const ta = document.createElement('textarea');
      ta.value = txt;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
  };
}

function animateNumber(el, from, to, dur) {
  const t0 = performance.now();
  function step(t) {
    const p = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * e);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function drawRadar(u, cv, color) {
  const svg = document.getElementById('radar');
  if (!svg) return;
  const cx = 130, cy = 120, R = 78;
  const n = DIMS.length;
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
  // z 分数 → 半径（z 通常在 -2.2 ~ 2.2）
  const mapR = z => Math.min(1, Math.max(0.07, (z + 2.2) / 4.4));
  const pt = (i, r) => [cx + Math.cos(ang(i)) * r, cy + Math.sin(ang(i)) * r];

  let html = '';

  // 网格
  [0.25, 0.5, 0.75, 1].forEach(k => {
    const pts = DIMS.map((_, i) => pt(i, R * k).join(',')).join(' ');
    html += `<polygon points="${pts}" fill="none" stroke="rgba(40,90,140,0.14)" stroke-width="1"/>`;
  });
  DIMS.forEach((_, i) => {
    const [x, y] = pt(i, R);
    html += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(40,90,140,0.12)"/>`;
  });

  // 角色：虚线，避免和用户实线混在一起
  const cPts = cv.map((v, i) => pt(i, R * mapR(v)).join(',')).join(' ');
  html += `<polygon points="${cPts}" fill="${hexA(color, 0.10)}" stroke="${color}" stroke-width="1.5"
            stroke-dasharray="4 3" stroke-linejoin="round"/>`;

  // 用户：实线 + 顶点
  const uPts = u.map((v, i) => pt(i, R * mapR(v)).join(',')).join(' ');
  html += `<polygon points="${uPts}" fill="var(--pink)" fill-opacity="0.17" stroke="var(--pink)"
            stroke-width="2" stroke-linejoin="round"/>`;
  u.forEach((v, i) => {
    const [x, y] = pt(i, R * mapR(v));
    html += `<circle cx="${x}" cy="${y}" r="2.4" fill="#fff" stroke="var(--pink)" stroke-width="1.6"/>`;
  });

  // 标签
  DIMS.forEach((d, i) => {
    const [x, y] = pt(i, R + 22);
    html += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle"
      font-size="11" fill="#3d5d7d">${DIM_LABEL[d]}</text>`;
  });

  svg.innerHTML = html;
}

/* ---------------- 题目随机排序 ---------------- */
// 每次开测都打乱题目顺序（Fisher-Yates）
function shuffleQuestions() {
  for (let i = QUESTIONS.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [QUESTIONS[i], QUESTIONS[j]] = [QUESTIONS[j], QUESTIONS[i]];
  }
}

/* ---------------- 启动 ---------------- */
document.addEventListener('DOMContentLoaded', () => {
  const CODE = '8800';   // 固定提取码

  $('#btnStart').addEventListener('click', () => {
    const input = $('#gateCode');
    const err = $('#gateErr');
    // 有提取码输入框才校验，没有则直接开始
    if (input && input.value.trim() !== CODE) {
      err.classList.add('show');
      input.classList.remove('err');
      void input.offsetWidth;
      input.classList.add('err');
      input.focus();
      return;
    }
    if (err) err.classList.remove('show');
    if (input) input.classList.remove('err');
    shuffleQuestions();
    state.answers = new Array(QUESTIONS.length).fill(null);
    showScreen('s-quiz');
    renderQuestion();
  });

  // 提取码：只允许数字，回车直接开始
  const gateInput = $('#gateCode');
  if (gateInput) {
    gateInput.addEventListener('input', () => {
      gateInput.value = gateInput.value.replace(/[^0-9]/g, '').slice(0, 4);
    });
    gateInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') $('#btnStart').click();
    });
  }

  $('#btnBack').addEventListener('click', () => {
    if (state.idx > 0) { state.idx--; renderQuestion(); }
  });
  $('#btnQuit').addEventListener('click', () => {
    state.idx = 0;
    state.answers = new Array(QUESTIONS.length).fill(null);
    showScreen('s-start');
  });

  // 键盘
  document.addEventListener('keydown', e => {
    if (!$('#s-quiz').classList.contains('is-active')) return;
    if (['1', '2', '3', '4', '5', '6'].includes(e.key)) {
      const btns = document.querySelectorAll('.opt');
      const i = parseInt(e.key, 10) - 1;
      if (btns[i]) btns[i].click();
    }
    if (e.key === 'ArrowLeft') $('#btnBack').click();
  });
});
